name: ホムラ価格取得

on:
  workflow_dispatch:  # 手動実行のみ（GitHubのActionsタブ or Claude Code から起動）

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: ホムラから価格を取得（全4ゲーム）
        run: |
          python main.py -g pokemon    --fetch-web --competitor homura --dry-run
          python main.py -g onepiece   --fetch-web --competitor homura --dry-run
          python main.py -g yugioh     --fetch-web --competitor homura --dry-run
          python main.py -g dragonball --fetch-web --competitor homura --dry-run

      - name: JSONをコミット＆プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/homura_*.json
          if git diff --cached --quiet; then
            echo "変更なし（価格据え置き）"
          else
            DATE=$(date '+%m/%d' --date='TZ="Asia/Tokyo"')
            git commit -m "Auto: ホムラ ${DATE} 価格データ取得"
            git push
          fi
